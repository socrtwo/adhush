<!doctype html>
<!-- AdHush web front end: a thin client over src/adhush/ipc/api.py.
     The core serves this page itself at http://<host>:<port>/ when [ipc] is
     enabled, so any phone, tablet, or PC on the network needs only that
     address. Opening the file directly (file://) still works — the API sends
     permissive CORS — but then the service worker / install prompt is off,
     because browsers only allow those over http(s).
     No build step, no dependencies. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AdHush">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>AdHush</title>
<style>
  :root { --bg: #101418; --card: #1a2027; --text: #e8edf2; --dim: #8a97a5;
          --ok: #46c46f; --bad: #e05555; --warn: #e0a545; --accent: #4aa3e0; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg);
         color: var(--text); display: grid; place-items: center; min-height: 100vh; }
  main { width: min(28rem, 92vw); display: grid; gap: 1rem; padding: 2rem 0; }
  h1 { font-size: 1.2rem; margin: 0; letter-spacing: 0.04em; display: flex;
       justify-content: space-between; align-items: center; }
  h1 small { font-weight: 400; color: var(--dim); font-size: 0.8rem; letter-spacing: 0; }
  .card { background: var(--card); border-radius: 12px; padding: 1rem 1.25rem; }
  #state { font-size: 2rem; font-weight: 700; }
  #state.muted { color: var(--bad); }
  #state.program { color: var(--ok); }
  #state.suspect { color: var(--warn); }
  .dim { color: var(--dim); font-size: 0.85rem; }
  .row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }
  button { flex: 1; padding: 0.6rem 0.9rem; border: 0; border-radius: 8px;
           background: #2a3542; color: var(--text); font: inherit; cursor: pointer; }
  button:hover { background: #34424f; }
  button.active { background: var(--accent); color: #06141f; }
  button.danger { background: #3a2323; color: #f0b0b0; }
  input { width: 100%; box-sizing: border-box; padding: 0.5rem 0.7rem;
          border-radius: 8px; border: 1px solid #2a3542; background: #0d1114;
          color: var(--text); font: inherit; }
  #log { max-height: 12rem; overflow-y: auto; font-family: ui-monospace, monospace;
         font-size: 0.78rem; white-space: pre-wrap; }
  /* Compact layout: used inside the Picture-in-Picture window and the popup fallback. */
  body.mini { min-height: 0; display: block; }
  body.mini main { width: auto; padding: 0.4rem 0.6rem; gap: 0; }
  body.mini .full { display: none; }
  body.mini #pill { display: flex; align-items: center; gap: 0.5rem; }
  #pill { display: none; }
  #pill .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--dim); flex: none; }
  #pill .label { font-weight: 700; font-size: 0.95rem; flex: 1; }
  #pill button { flex: none; padding: 0.3rem 0.55rem; font-size: 0.95rem; }
</style>
</head>
<body>
<main>
  <!-- compact pill: the mini window's whole UI -->
  <div id="pill">
    <span class="dot" id="pill-dot"></span>
    <span class="label" id="pill-label">…</span>
    <button title="Not an ad" onclick="command({type:'reject_ad'})">✗</button>
    <button title="Is an ad" onclick="command({type:'confirm_ad'})">✓</button>
    <button title="Stop AdHush" class="danger" onclick="stopCore()">■</button>
  </div>

  <h1 class="full">ADHUSH <small id="version"></small></h1>
  <div class="card full">
    <div id="state">connecting…</div>
    <div id="detail" class="dim"></div>
    <div class="row">
      <button id="b-auto"   onclick="setOverride('auto')">Auto</button>
      <button id="b-mute"   onclick="setOverride('mute')">Mute</button>
      <button id="b-unmute" onclick="setOverride('unmute')">Unmute</button>
    </div>
    <div class="row">
      <button onclick="command({type:'confirm_ad'})">✓ Is an ad</button>
      <button onclick="command({type:'reject_ad'})">✗ Not an ad</button>
    </div>
    <div class="row">
      <button onclick="openMini()" title="Small always-on-top window">▣ Mini window</button>
      <button class="danger" onclick="stopCore()" title="Shut the core down">■ Stop AdHush</button>
    </div>
  </div>
  <div class="card full">
    <div class="dim">Core API (host:port of `adhush run`, [ipc] enabled)</div>
    <div class="row">
      <input id="base">
      <input id="token" placeholder="token (optional)">
      <button style="flex:0" onclick="connect()">Connect</button>
    </div>
  </div>
  <div class="card full"><div id="log" class="dim"></div></div>
</main>
<script>
let source = null;
let pollTimer = null;
let pipWindow = null;

// Served by the core: talk to wherever we came from. Opened as a file: loopback.
const defaultBase = location.protocol.startsWith('http') ? location.origin : 'http://127.0.0.1:8675';
document.getElementById('base').value = defaultBase;
if (location.hash === '#mini') document.body.classList.add('mini');

function base() { return document.getElementById('base').value.replace(/\/+$/, ''); }
function headers() {
  const token = document.getElementById('token').value.trim();
  const all = {'Content-Type': 'application/json'};
  if (token) all['Authorization'] = 'Bearer ' + token;
  return all;
}
function logLine(text) {
  const el = document.getElementById('log');
  el.textContent = new Date().toLocaleTimeString() + '  ' + text + '\n' + el.textContent;
}
function styleFor(status) {
  if (!status) return ['OFFLINE', 'var(--dim)', ''];
  if (status.override === 'mute') return ['MUTED', 'var(--bad)', 'muted'];
  if (status.override === 'unmute') return ['PROGRAM', 'var(--ok)', 'program'];
  if (status.muted) return ['MUTED', 'var(--bad)', 'muted'];
  if (status.state === 'suspect_ad') return ['SUSPECT', 'var(--warn)', 'suspect'];
  if (status.state === 'ad') return ['MUTED', 'var(--bad)', 'muted'];
  return [String(status.state || '…').toUpperCase(), 'var(--ok)', 'program'];
}
function render(status) {
  const [label, colour, cls] = styleFor(status);
  const el = document.getElementById('state');
  el.textContent = label; el.className = cls;
  document.getElementById('detail').textContent = status
    ? 'override: ' + status.override + ' · detectors: ' + status.detectors.join(', ') : '';
  for (const mode of ['auto', 'mute', 'unmute'])
    document.getElementById('b-' + mode).className = status && status.override === mode ? 'active' : '';
  // every pill: the page's own, and the one living in the PiP window
  for (const doc of [document, pipWindow && pipWindow.document].filter(Boolean)) {
    const dot = doc.getElementById('pill-dot'), lab = doc.getElementById('pill-label');
    if (dot) dot.style.background = colour;
    if (lab) lab.textContent = label;
  }
}
async function command(body) {
  try {
    const response = await fetch(base() + '/command', {
      method: 'POST', headers: headers(), body: JSON.stringify({v: 1, ...body})});
    logLine(body.type + ' → ' + await response.text());
    refresh();
  } catch (err) { logLine('command failed: ' + err); }
}
function setOverride(mode) { command({type: 'override', mode}); }
async function stopCore() {
  if (!confirm('Stop AdHush? Sound will be restored and detection stops until you start it again.')) return;
  await command({type: 'shutdown'});
  render(null);
}
async function refresh() {
  try {
    const response = await fetch(base() + '/status', {headers: headers()});
    render((await response.json()).data);
  } catch (err) { render(null); }
}
function connect() {
  if (source) source.close();
  if (pollTimer) clearInterval(pollTimer);
  // EventSource cannot send Authorization headers; SSE therefore works
  // tokenless — with a token set, fall back to polling.
  if (document.getElementById('token').value.trim()) {
    logLine('token set: polling /status instead of SSE');
    pollTimer = setInterval(refresh, 2000); refresh(); return;
  }
  source = new EventSource(base() + '/events');
  source.onmessage = (event) => {
    const message = JSON.parse(event.data);
    if (message.type === 'status') render(message.data);
    else logLine(message.type + ': ' + JSON.stringify(message.data));
    if (message.type === 'transition') refresh();
  };
  source.onerror = () => render(null);
  refresh();
}

// The always-on-top mini window. Chromium 116+ (desktop Chrome/Edge/ChromeOS)
// has the Document Picture-in-Picture API: a real always-on-top, movable
// window that stays above other apps. Elsewhere, a small popup is the best a
// browser can do; it floats above *this* tab but not above other apps — the
// desktop overlay (`adhush overlay`) is the always-on-top answer there.
async function openMini() {
  if ('documentPictureInPicture' in window) {
    pipWindow = await documentPictureInPicture.requestWindow({width: 250, height: 64});
    for (const sheet of document.styleSheets) {
      const style = pipWindow.document.createElement('style');
      style.textContent = [...sheet.cssRules].map(r => r.cssText).join('\n');
      pipWindow.document.head.appendChild(style);
    }
    pipWindow.document.body.classList.add('mini');
    const pill = document.getElementById('pill').cloneNode(true);
    pill.style.display = 'flex';
    pipWindow.document.body.appendChild(pill);
    // buttons in the PiP document call back into this page's functions
    pill.querySelectorAll('button').forEach(b => {
      const call = b.getAttribute('onclick'); b.removeAttribute('onclick');
      b.addEventListener('click', () => new Function(call).call(window));
    });
    pipWindow.addEventListener('pagehide', () => { pipWindow = null; });
    refresh();
    return;
  }
  const popup = window.open(location.pathname + '#mini', 'adhush-mini',
    'popup,width=260,height=70,resizable=yes');
  if (!popup) logLine('popup blocked — allow popups for this page');
}

document.getElementById('version').textContent = 'thin client · protocol v1';
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(err => logLine('sw: ' + err));
}
connect();
</script>
</body>
</html>
