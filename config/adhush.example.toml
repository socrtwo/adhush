# Copy to config/adhush.toml and edit.

[capture]
# backend = "ts_stream" reads an MPEG transport stream: url = "http://192.168.1.50:5004/auto/v7" (HDHomeRun) or "udp://:1234" (ADR 0024)
# stereo = true measures the mix's width before the mono downmix on hdmi_uvc, line_in and ts_stream (ADR 0023)
backend = "hdmi_uvc"        # hdmi_uvc | camera | microphone | line_in | screen | file_replay
device = "/dev/video0"
width = 1280
height = 720
fps = 30
audio_device = "default"

[device]
profile = "sharp-lc46le830u"

[detect]
enabled = ["black_frame", "silence", "loudness", "logo_absence", "scene_cut", "fingerprint", "clock", "jingle", "aspect_change",
           "rating_bug", "ad_units", "cutscene", "stereo_width", "watermark", "schedule", "scte35", "crowd", "stinger"]   # the last nine are inert until they have evidence (ADR 0023/0024/0027)

[detect.logo_absence]
roi = { x = 0.84, y = 0.80, w = 0.14, h = 0.14 }   # default comes from the device profile
absence_frames = 45
template = "data/logos/logo.npz"    # written by `adhush calibrate`
present_threshold = 0.4

[detect.scene_cut]
diff_threshold = 12.0
window_s = 10.0
low_cpm = 15.0      # cut rate mapping: 0 confidence here...
high_cpm = 40.0     # ...1.0 confidence here

[detect.loudness]
window_s = 1.5      # short window: quick unmute matters more than R128's 3 s
delta_lufs = 2.5
max_elevated_s = 180  # elevated longer than any ad pod: the baseline is wrong, let it follow
crest_drop_db = 4.0   # a spot compressed this far flatter than the show adds half a vote; 0 = off (ADR 0021)

[detect.aspect_change]   # HDMI and screen paths: the picture's shape leaves the programme's (ADR 0021)
frame_aspect = 1.7778    # the shape of the whole captured frame (16:9)
bar_luma = 24            # a row or column this dark on average is a bar...
bar_spread = 8           # ...if it is also this flat
confirm_s = 1.0          # a new shape must hold this long before it counts
baseline_s = 600         # the programme's shape is the mode over this long
max_change_s = 360       # changed longer than any break: the programme changed shape

[detect.black_frame]
luma_threshold = 16
min_run_frames = 3
uniform_spread = 6.0     # a white flash or colour card counts like black; 0 = black only (ADR 0023)

[detect.rating_bug]      # the parental-rating box after a break: the show is back (ADR 0023)
roi = { x = 0.0, y = 0.02, w = 0.22, h = 0.16 }
hold_s = 20

[detect.ad_units]        # separators on the 15/30/60 s ad-unit grid hold a mute (ADR 0023)
tolerance_s = 1.2
hold_s = 35

[detect.cutscene]        # adhush cutscene add --kind in|out --image still.png   (ADR 0023)
directory = "data/cutscenes"

[detect.stereo_width]    # the mix switches mono <-> stereo; needs capture.stereo = true (ADR 0023)
min_delta = 0.15

[detect.watermark]       # ATSC A/335 / DVB-TA presence; experimental, inert on an unmarked channel (ADR 0023)
lines = 2

[detect.schedule]        # XMLTV from Schedules Direct or tv_grab_*; empty file = off (ADR 0024)
file = ""
channel = ""             # the XMLTV channel id or display name you watch
start_grace_s = 90
ad_free = []             # channels that never carry ads: ["PBS"]

[detect.scte35]          # splice cues from a ts_stream capture (ADR 0024)
max_break_s = 360

[detect.crowd]           # other AdHush devices on the same channel; opt-in (ADR 0024)
url = ""                 # "http://pi.local:8676" — adhush crowd serve
channel = ""             # hashed with the salt before it leaves the device
report = true
min_reports = 2

[detect.stinger]         # the whoosh or hit on the cut into a segment (ADR 0027); default weight, inert until it fires
min_flatness = 0.25      # a burst is noisy, not tonal
burst_above_db = 6.0     # over the two seconds before it
level_step_db = 3.0      # and the level has moved afterwards ...
loud_burst_db = 10.0     # ... or the burst itself was this far above
hold_s = 2.5

[detect.silence]
dbfs_threshold = -50.0
min_run_ms = 400

[fingerprint]
enabled = true
store = "data/fingerprints/ads.sqlite"
hash = "phash"
hamming_threshold = 10
audio_corroboration = true
learn = true
slot_snap_s = [15, 30, 45, 60]
sample_interval_s = 0.5
window_s = 6.0          # how much of an ad's start is fingerprinted
confirm_hits = 3        # consecutive matching samples to promote to AD
snap_min_samples = 3    # airings before the learned duration beats the snap

[fusion]
mute_confidence = 0.72
unmute_confidence = 0.45
mute_dwell_ms = 900
unmute_dwell_ms = 400
max_mute_s = 240          # hard ceiling; never stay muted past this
fp_unmute_dwell_ms = 3000 # program evidence needed this long to cut a matched ad short

[control]
backend = "rs232_sharp"    # rs232_sharp | ir_lirc | ir_pigpio | cec | ir_blaster_net | network_ip | local_audio
verify_with_audio = true

[control.rs232_sharp]
port = "/dev/ttyUSB0"
baud = 9600

[control.ir_lirc]
remote = "sharp_aquos"
mute_on = "KEY_MUTE_ON"
mute_off = "KEY_MUTE_OFF"
repeat = 2

[ipc]
enabled = false            # HTTP+SSE API for platform front ends (ADR 0006)
host = "127.0.0.1"         # keep loopback unless the LAN is trusted
port = 8675
token = ""                 # require Authorization: Bearer <token> when set
web_root = "platforms/web"  # the core serves the web app at http://host:port/

[ui]
overlay = true             # always-on-top mini window next to `adhush run` (needs [ipc])

[log]
level = "info"
trace_detectors = false
