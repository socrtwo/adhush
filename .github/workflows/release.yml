name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # One-file binaries of the Python core (ADR 0019): the web front end,
  # the device profiles and the example configs travel inside. ffmpeg is the
  # only runtime dependency, on PATH. Each binary is smoke-tested on its own
  # runner before it may be published.
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     name: linux-x64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
          - { os: macos-latest,     name: macos-arm64 }
          - { os: windows-latest,   name: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        shell: bash
        run: |
          pip install ".[pi]" pyinstaller
          pyinstaller --noconfirm --clean packaging/adhush.spec
      - name: Smoke test the binary
        shell: bash
        run: |
          set -e
          bin="$PWD/dist/adhush"; [ "${{ runner.os }}" = Windows ] && bin="$PWD/dist/adhush.exe"
          "$bin" --version
          mkdir smoke && cd smoke
          "$bin" init --config adhush.toml
          test -f adhush.toml && test -d profiles
          "$bin" doctor --config adhush.toml || true
          python - <<'PY'
          import sys; sys.path.insert(0, "..")
          from adhush.capture.file_replay import write_fixture
          from tests.synth import RATE, synthesize
          frames, ts, audio, labels = synthesize([("program", 6.0), ("boundary", 1.0), ("ad", 12.0), ("program", 6.0)])
          write_fixture("fixture.npz", frames=frames, frame_ts=ts, audio=audio, audio_rate=RATE)
          print("fixture ok")
          PY
          "$bin" replay fixture.npz | tail -5
      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          if [ "${{ runner.os }}" = macOS ]; then
            (cd dist && zip -q "../out/adhush-${version}-${{ matrix.name }}.zip" adhush)
          else
            tar -C dist -czf "out/adhush-${version}-${{ matrix.name }}.tar.gz" adhush
          fi
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist\adhush.exe, dist\adhushw.exe -DestinationPath "out\adhush-$version-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  build-and-publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt build
      - run: ruff check src tests && mypy src && pytest -q
      - run: python -m build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android core tests and debug APK
        working-directory: platforms/android
        run: ./gradlew :core:test :app:assembleDebug --no-daemon
      - name: Name the APK by version
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk "dist/adhush-${version}-android-debug.apk"
      - name: "Bundle the web front end (also the iOS install, via Add to Home Screen)"
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd platforms/web && zip -r "../../dist/adhush-web-${version}.zip" .)
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist/bin
          merge-multiple: true
      - name: Raspberry Pi bundle (arm64 binary, listener config, guides)
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p pi && tar -C pi -xzf "dist/bin/adhush-${version}-linux-arm64.tar.gz"
          cp config/adhush-listener.example.toml pi/
          cp docs/print/AdHush-beginner-guide-listener-NESPi4.pdf docs/print/AdHush-beginner-guide-NESPi4.pdf pi/ 2>/dev/null || true
          cat > pi/README.txt <<'TXT'
          AdHush for Raspberry Pi 4 / 5 (64-bit Raspberry Pi OS, bookworm or newer)

            sudo apt install -y ffmpeg
            chmod +x adhush
            ./adhush init --listener          # writes config/adhush.toml and the profiles
            nano config/adhush.toml           # the TV's serial port or address
            ./adhush doctor                   # what is missing, if anything
            ./adhush probe --active           # the set should mute and unmute
            ./adhush service install          # start at login, restart on failure

          The illustrated build guides are in this folder as PDFs. Everything else:
          https://github.com/socrtwo/adhush/blob/main/docs/build-guide-tv-listener.md
          TXT
          (cd pi && zip -q -r "../dist/adhush-${version}-raspberry-pi.zip" .)
          mv dist/bin/* dist/ && rmdir dist/bin
          ls -la dist
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}' CHANGELOG.md > dist/notes.md
          cat >> dist/notes.md <<'TXT'

          ## Downloads by platform

          | Platform | File |
          |---|---|
          | Android (phone app) | `adhush-<ver>-android-debug.apk` — sideload |
          | iOS / any phone (web app) | open `http://<core>:8675/` in Safari or Chrome → Add to Home Screen; the page is in `adhush-web-<ver>.zip` |
          | Windows 10/11 x64 | `adhush-<ver>-windows-x64.zip` — `adhush.exe` (terminal) and `adhushw.exe` (silent, for the logon task) |
          | macOS (Apple silicon) | `adhush-<ver>-macos-arm64.zip` — Intel Macs: the wheel |
          | Linux x64 / ChromeOS (Intel) | `adhush-<ver>-linux-x64.tar.gz` |
          | Linux arm64 / ChromeOS (ARM) | `adhush-<ver>-linux-arm64.tar.gz` |
          | Raspberry Pi 4 / 5 | `adhush-<ver>-raspberry-pi.zip` — binary, listener config, the PDF guides |
          | Any Python 3.11+ | `adhush-<ver>-py3-none-any.whl` |

          Platform matrix and what each build can do: docs/release.md
          TXT
      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/adhush-*-android-debug.apk
