name: android

on:
  push:
    paths: ["platforms/android/**", ".github/workflows/android.yml", "tools/gen_conformance.py"]
  pull_request:
    paths: ["platforms/android/**", ".github/workflows/android.yml", "tools/gen_conformance.py"]

jobs:
  build:
    runs-on: ubuntu-latest   # ships the Android SDK; Google's Maven is reachable here
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (pure Kotlin, includes the Python-conformance fixture)
        run: ./gradlew :core:test --no-daemon
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: adhush-android-debug
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-report
          path: platforms/android/core/build/reports/tests/test
