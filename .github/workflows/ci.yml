name: ci

# Every branch, not only main: work happens on long-lived feature branches
# here, and before 0.24.0 these checks first ran at release time — where a
# missing optional dependency failed the publish after every binary had built.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: mypy src
      - run: pytest -q
